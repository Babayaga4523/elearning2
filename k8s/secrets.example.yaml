# ============================================
# KUBERNETES SECRETS TEMPLATE
# ============================================
# JANGAN COMMIT FILE INI KE GIT!
# Copy ke secrets.yaml dan isi dengan nilai sebenarnya
# ============================================

apiVersion: v1
kind: Secret
metadata:
  name: elearning-secrets
  namespace: production
type: Opaque
stringData:
  # Database Connection
  database-url: "postgresql://user:password@postgres-host:5432/elearning_db?schema=public"
  
  # NextAuth Secret (generate dengan: openssl rand -base64 32)
  nextauth-secret: "your-nextauth-secret-here"
  
  # Microsoft Entra ID (Azure AD)
  azure-ad-client-id: "your-azure-ad-client-id"
  azure-ad-client-secret: "your-azure-ad-client-secret"
  azure-ad-tenant-id: "your-azure-ad-tenant-id"
  
  # Email Configuration (Optional)
  email-server: "smtp://user:password@smtp.gmail.com:587"
  email-from: "noreply@bnif.co.id"
