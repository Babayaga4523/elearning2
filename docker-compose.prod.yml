version: '3.8'

services:
  app:
    image: elearning-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning-app-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      # These should be provided by your CI/CD (Jenkins) or AKS Secrets
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Email & other sensitive configs
      # CRON_SECRET: ${CRON_SECRET}
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
    # No managed DB here as it is external (Supabase/Azure RDS)
