<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1C3F"/>
      <stop offset="100%" stop-color="#050A1A"/>
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD659"/>
      <stop offset="50%" stop-color="#E8A020"/>
      <stop offset="100%" stop-color="#B87D14"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.8" flood-color="#000"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.4"/>
  
  <g filter="url(#shadow)">
    <text 
      x="50%" 
      y="55%" 
      font-family="Impact, Arial Black, sans-serif" 
      font-size="160" 
      font-weight="900" 
      letter-spacing="4"
      fill="url(#gold)" 
      text-anchor="middle" 
      dominant-baseline="middle">
      HCMS
    </text>
  </g>
</svg>
